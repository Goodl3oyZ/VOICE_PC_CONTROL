# PC1 stack (US-801): `docker compose --env-file .env up -d` inside the Proxmox VM.
# GPU: requires PCIe passthrough to the VM + NVIDIA Container Toolkit (Spike SP-3).
services:
  orchestrator:
    build: { context: .., dockerfile: infra/Dockerfile.pc1 }
    restart: unless-stopped
    environment:
      VPC_STT: faster_whisper
      VPC_WHISPER_MODEL: ${VPC_WHISPER_MODEL:-small}
      VPC_LLM: ollama
      VPC_OLLAMA_URL: http://ollama:11434
      VPC_OLLAMA_MODEL: ${VPC_OLLAMA_MODEL:-qwen2.5:3b}
      VPC_PC2: http
      VPC_PC2_URL: ${VPC_PC2_URL:?set PC2 agent URL (VPN IP)}
      VPC_PC2_SECRET: ${VPC_PC2_SECRET:?set shared HMAC secret}
    volumes:
      - pc1-data:/data
      - whisper-cache:/home/vpc/.cache
    expose: ["8000"]
    depends_on: [ollama]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes: [ollama:/root/.ollama]
    expose: ["11434"]  # never published outside the compose network
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["443:443"]  # bind only on the VPN/LAN interface via host firewall
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [orchestrator]

volumes:
  pc1-data:
  whisper-cache:
  ollama:
  caddy-data:
