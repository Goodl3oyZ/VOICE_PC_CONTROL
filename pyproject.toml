[project]
name = "voice-pc-control"
version = "0.1.0"
description = "Voice-controlled PC via local AI: Mobile PWA -> PC1 orchestrator -> PC2 Windows agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["contracts", "pc1-orchestrator", "pc2-agent", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["security: security test cases (TC-S*)"]

[tool.coverage.run]
source = ["pc1-orchestrator/app/core", "pc2-agent/agent/policy", "contracts/voice_contracts"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mobile-pwa"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S311", "UP042", "B008"]  # B008: FastAPI's File()/Depends() defaults idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"eval/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent", "voice_contracts"]
